<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Short-Memory File Agent</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #f6f7f9 0%, #e9ebee 100%);
      padding: 60px 20px;
      color: #1d1d1f;
    }
    .card {
      max-width: 700px; margin: auto;
      background: #fff; border-radius: 20px;
      padding: 40px; box-shadow: 0 6px 24px rgba(0,0,0,0.1);
    }
    h1 { text-align: center; font-size: 26px; margin-bottom: 30px; }
    label { font-weight: 500; display: block; margin-top: 18px; }
    input[type=file], textarea {
      width: 100%; margin-top: 8px; padding: 12px;
      border: 1px solid #d1d1d6; border-radius: 10px;
      font-size: 15px; background: #fafafa;
    }
    button {
      width: 100%; padding: 13px 0; margin-top: 15px;
      border: none; border-radius: 10px;
      font-size: 16px; font-weight: 600; color: #fff;
      background: #000; cursor: pointer;
    }
    button:hover { background: #1d1d1f; }
    .status, .answer { margin-top: 12px; font-size: 15px; }
    .green { background:#34c759; }
    .red { background:#ff3b30; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Short-Memory File Agent</h1>

    <label>Upload Files</label>
    <input type="file" id="fileInput" multiple />
    <button onclick="uploadFiles()">Upload</button>
    <p id="status" class="status"></p>

    <hr>

    <label>Ask a Question</label>
    <textarea id="question" placeholder="Type your question..."></textarea>
    <button onclick="askQuestion()">Ask</button>
    <div id="answer" class="answer"></div>

    <hr>
    <button class="green" onclick="resetMemory()">♻️ Reset Short-Term Memory</button>
    <p id="resetStatus" class="status"></p>
  </div>

  <script>
    const API_URL = "https://my-dual-agent.onrender.com";

    async function uploadFiles() {
      const files = document.getElementById("fileInput").files;
      if (!files.length) return alert("No files selected.");

      const formData = new FormData();
      for (let f of files) formData.append("files", f);

      document.getElementById("status").innerText = "⏳ Uploading...";
      try {
        const res = await fetch(`${API_URL}/upload`, { method: "POST", body: formData });
        const data = await res.json();
        document.getElementById("status").innerText = data.message || data.error;
      } catch (err) {
        document.getElementById("status").innerText = "❌ " + err.message;
      }
    }

    async function askQuestion() {
      const q = document.getElementById("question").value.trim();
      if (!q) return alert("Enter a question first.");

      document.getElementById("answer").innerText = "⏳ Thinking...";
      try {
        const res = await fetch(`${API_URL}/ask`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: q })
        });
        const data = await res.json();
        document.getElementById("answer").innerText = data.answer || data.error;
      } catch (err) {
        document.getElementById("answer").innerText = "❌ " + err.message;
      }
    }

    async function resetMemory() {
      try {
        const res = await fetch(`${API_URL}/reset`, { method: "POST" });
        const data = await res.json();
        document.getElementById("resetStatus").innerText = data.message;
      } catch (err) {
        document.getElementById("resetStatus").innerText = "❌ " + err.message;
      }
    }
  </script>
</body>
</html>
