<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🧠 Dual-Memory File Agent</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f7;
      margin: 0;
      padding: 40px;
      color: #1d1d1f;
    }
    .container {
      max-width: 700px;
      margin: auto;
      background: #fff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    h1 { text-align: center; font-size: 26px; margin-bottom: 20px; }
    input, button, textarea {
      width: 100%; margin-top: 10px; padding: 10px;
      border-radius: 10px; border: 1px solid #ccc; font-size: 15px;
    }
    button { background: black; color: white; cursor: pointer; }
    button:hover { opacity: 0.8; }
    .answer {
      background: #f0f0f0;
      padding: 15px;
      border-radius: 12px;
      margin-top: 10px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧠 Dual-Memory File Agent</h1>

    <label>Upload Files:</label>
    <input type="file" id="fileInput" multiple />
    <label><input type="checkbox" id="keep"> Keep permanently?</label>
    <button onclick="uploadFiles()">Upload</button>
    <p id="status"></p>

    <hr>

    <textarea id="question" rows="3" placeholder="Ask a question..."></textarea>
    <button onclick="askQuestion()">Ask</button>
    <div id="answer" class="answer"></div>

    <hr>
    <button onclick="resetMemory()">♻️ Reset Short-Term Memory</button>
    <p id="resetStatus"></p>
  </div>

  <script>
    // 🔗 Change this to your actual Render backend (no trailing slash)
    const API_URL = "https://my-dual-agent.onrender.com";

    async function uploadFiles() {
      const files = document.getElementById("fileInput").files;
      const keep = document.getElementById("keep").checked;
      if (!files.length) return alert("No files selected!");

      const formData = new FormData();
      for (let f of files) formData.append("files", f);
      formData.append("keep", keep);

      try {
        const res = await fetch(`${API_URL}/upload`, { method: "POST", body: formData });
        const data = await res.json();
        document.getElementById("status").innerText =
          data.message || data.error || "✅ Upload complete.";
      } catch (err) {
        document.getElementById("status").innerText = "❌ Upload failed: " + err.message;
      }
    }

    async function askQuestion() {
      const q = document.getElementById("question").value.trim();
      if (!q) return alert("Please enter a question first.");

      try {
        const res = await fetch(`${API_URL}/ask`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: q })
        });
        const data = await res.json();
        document.getElementById("answer").innerText =
          data.answer || data.error || "❌ No answer received.";
      } catch (err) {
        document.getElementById("answer").innerText = "❌ Error: " + err.message;
      }
    }

    async function resetMemory() {
      try {
        const res = await fetch(`${API_URL}/reset`, { method: "POST" });
        const data = await res.json();
        document.getElementById("resetStatus").innerText =
          data.message || data.error || "♻️ Reset complete.";
      } catch (err) {
        document.getElementById("resetStatus").innerText = "❌ Error: " + err.message;
      }
    }
  </script>
</body>
</html>
